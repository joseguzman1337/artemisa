name: Auto Update and Merge
# This workflow was disabled because it used the dangerous pattern of:
#   - pull_request_target trigger
#   - actions/checkout of ${{ github.event.pull_request.head.ref }}
#   - git merge of attacker-controlled branch
#   - direct push to master
# This is a known RCE vector (see CWE-829 / Security Lab "pwn requests").
# Replaced with workflow_dispatch only — re-enable only after redesigning with
# `pull_request` trigger and ref: master (NEVER head.ref).
on: workflow_dispatch

permissions:
  contents: read

jobs:
  noop:
    runs-on: ubuntu-latest
    steps:
      - name: Disabled - this workflow was auto-merge, removed for security
        run: |
          echo "This workflow was disabled because the auto-merge pattern was a security risk."
          echo "Re-enable only after a security review."
